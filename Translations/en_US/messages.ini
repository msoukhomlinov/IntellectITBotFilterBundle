; Plural forms use Symfony's interval/pipe message format, resolved by |trans({'%count%': n}).
; The zero case is not a rounding nicety: an EMPTY honeypot allowlist means every email is
; honeypotted (HoneypotInjectionSubscriber::emailAllowed() returns true on a blank setting), so
; "0 allowed" would state the exact inverse of what the plugin does.
mautic.botfilter.health.allowlist_count="{0}All emails|{1}%count% email allowed|]1,Inf[%count% emails allowed"
mautic.botfilter.health.asndb.age="{0}Updated today|{1}%count% day old|]1,Inf[%count% days old"
mautic.botfilter.list.contact_fallback="Contact #%id%"
mautic.botfilter.list.capture_caveat="Only hits that reach the burst-detection decorator, plus honeypot hits, are recorded here — this is a sample of filtered activity, not a complete picture of all bot traffic."
mautic.botfilter.error.query_failed="Something went wrong loading this list. Try again, or check the logs if it persists."

