mautic.botfilter.config.burst.sentence="Flag a hit as a scanner when the same email reaches the same contact from <strong>%ips%</strong> or more distinct IP addresses within <strong>%window%</strong> seconds."
mautic.botfilter.config.honeypot.description="Injects a hidden, non-trackable link into HTML emails — a security gateway that pre-fetches links trips it. The public endpoint (/bf/honeypot) always returns an empty 204 response, whether or not the hit was recorded."
mautic.botfilter.config.honeypot.warning="Seed-test and confirm deliverability before enabling broadly — this feature modifies outgoing message content."
mautic.botfilter.config.diagnostics.tables="Capture tables"
mautic.botfilter.config.diagnostics.asndb="ASN database"
mautic.botfilter.config.diagnostics.enrichment="Enrichment cache size"
mautic.botfilter.config.published.note.on="Published: the burst signal runs on opens and clicks with the thresholds below, plus the honeypot if enabled."
mautic.botfilter.config.published.note.off="Unpublished: standard Mautic only — its built-in bot signals still run, but they miss modern cloud link-scanners. No burst signal, no honeypot injection and no decorator capture rows while unpublished. Honeypot links in already-sent emails still record hits."
mautic.botfilter.config.honeypot.label="Enable honeypot link injection"
mautic.botfilter.config.honeypot.help="Injects a hidden, non-trackable link into HTML emails. A security gateway that pre-fetches links trips it, recording a deterministic \"this contact is behind a scanner\" signal. Off by default; injection takes effect only while this integration is published."
mautic.botfilter.config.allowlist.label="Honeypot email ID allowlist"
mautic.botfilter.config.allowlist.help="Comma-separated email IDs to honeypot. Leave blank to honeypot every email. Use it to pilot on a few sends before enabling broadly."
mautic.botfilter.config.burst.ips.label="Burst threshold — distinct IPs"
mautic.botfilter.config.burst.ips.help="Flag an open/click as a bot when this many DISTINCT IP addresses hit the same email+contact within the window below. Lower = more aggressive. Default 3; values under 2 are ignored (fall back to 3)."
mautic.botfilter.config.burst.window.label="Burst window (seconds)"
mautic.botfilter.config.burst.window.help="Time window, in seconds, over which the distinct IPs above are counted. Default 30; values under 1 are ignored (fall back to 30)."
