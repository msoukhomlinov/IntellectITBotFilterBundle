# OpenCodeReview — strix-slow (deep, effort high) PR review, parallel to PR-Agent
#
# Auto: PR opened/synchronize/reopened (pull_request_target) — runs alongside
# PR-Agent's auto-review. On-demand: comment `/open-code-review` (or
# `@open-code-review`) on a PR. This workflow runs the strix-slow (deep, effort high) pass. The companion workflow
# (ocr-flash.yml) runs the other model pass. Each workflow is a separate
# GitHub run, so each posts its own summary comment (the per-run summary tag
# is <run_id>-<attempt> — two jobs in ONE run share the tag and overwrite
# each other's summary).
#
# Runs on the maxlinux self-hosted runner: the strix endpoint
# (192.168.253.143:8600) is LAN-only, so GitHub-hosted runners cannot run it.
#
# Secret: OCR_STRIX_TOKEN

name: OCR PR Review (strix slow)

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-slow-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  # pull_request_target (not pull_request) so secrets are available for fork PRs;
  # the action only reads the diff — it checks out the trusted base and fetches
  # head blobs, it never executes PR code.
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  ocr-slow:
    runs-on: [self-hosted, maxlinux]
    timeout-minutes: 120
    if: >-
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Get PR context
        id: pr-context
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Run OpenCodeReview (strix slow)
        uses: alibaba/open-code-review@df7f3a1f8fa3f1b087bc6d6fefdeddbad96c3fdc # v1.13.6
        with:
          llm_url: http://192.168.253.143:8600/v1
          llm_auth_token: ${{ secrets.OCR_STRIX_TOKEN }}
          llm_model: slow
          llm_use_anthropic: 'false'
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
          effort: high
          review_concurrency: '2'
          sticky_summary: 'false'
          ocr_version: '1.13.6'
          llm_timeout: '900'
          review_task_timeout: '30'
          upload_artifacts: 'true'
